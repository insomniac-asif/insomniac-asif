<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Absent Born Labs — Asif Hossain">
  <defs>
    <clipPath id="frame"><rect width="900" height="240" rx="10"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#1A1420"/>
      <stop offset="55%" stop-color="#100F12"/>
      <stop offset="100%" stop-color="#0B0A0D"/>
    </radialGradient>
    <linearGradient id="aur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E7A6B" stop-opacity="0"/>
      <stop offset="45%" stop-color="#4DD3C0" stop-opacity=".35"/>
      <stop offset="80%" stop-color="#6B5CA8" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#6B5CA8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="url(#glow)"/>

    <!-- aurora ribbon -->
    <path d="M520 44 Q640 10 760 40 T900 30 L900 92 Q770 70 660 86 T520 96 Z" fill="url(#aur)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="7s" repeatCount="indefinite"/>
    </path>

    <!-- starfield -->
    <g fill="#E9E6DB">
      <circle cx="60" cy="38" r="1.1" opacity=".5"/>
      <circle cx="140" cy="90" r="0.9" opacity=".35"/>
      <circle cx="230" cy="30" r="1.3" opacity=".6">
        <animate attributeName="opacity" values=".6;.15;.6" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="70" r="0.8" opacity=".4"/>
      <circle cx="420" cy="24" r="1" opacity=".5">
        <animate attributeName="opacity" values=".5;.1;.5" dur="4.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="505" cy="120" r="0.9" opacity=".35"/>
      <circle cx="585" cy="60" r="1.2" opacity=".55"/>
      <circle cx="655" cy="140" r="0.8" opacity=".4">
        <animate attributeName="opacity" values=".4;.1;.4" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="735" cy="100" r="1" opacity=".5"/>
      <circle cx="815" cy="150" r="0.9" opacity=".4"/>
      <circle cx="865" cy="66" r="1.2" opacity=".55">
        <animate attributeName="opacity" values=".55;.15;.55" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="170" r="0.9" opacity=".35"/>
      <circle cx="290" cy="150" r="1" opacity=".45"/>
      <circle cx="480" cy="180" r="0.8" opacity=".3"/>
    </g>

    <!-- meteor -->
    <line x1="700" y1="18" x2="748" y2="44" stroke="#E9E6DB" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;.8;0;0" keyTimes="0;.62;.66;.72;1" dur="9s" repeatCount="indefinite"/>
    </line>

    <!-- the glyph: presence punched through the void -->
    <g transform="translate(56,54)">
      <rect x="0" y="0" width="46" height="46" fill="none" stroke="#E9E6DB" stroke-opacity=".45" stroke-width="2"/>
      <rect x="9" y="9" width="12" height="12" fill="#FF4438"/>
      <rect x="25" y="25" width="12" height="12" fill="#FF4438">
        <animate attributeName="fill-opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- wordmark -->
    <text x="128" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#E9E6DB" letter-spacing="1">Absent Born Labs</text>
    <text x="130" y="112" font-family="'Courier New', monospace" font-size="13" fill="#ABA6A8" letter-spacing="3">ASIF HOSSAIN · SELF-HOSTED MIND · NEW YORK</text>

    <!-- telemetry line -->
    <text x="130" y="150" font-family="'Courier New', monospace" font-size="12" fill="#FF4438" letter-spacing="1">&gt; systems that know what they don't know<tspan fill="#E9E6DB">_</tspan></text>
    <text x="130" y="172" font-family="'Courier New', monospace" font-size="11" fill="#7F7A7C" letter-spacing="1">agents · local &#160;&#160;egress · gated &#160;&#160;cloud · absent by design</text>

    <!-- the lab on the horizon, lights on -->
    <g transform="translate(660,168)">
      <line x1="-60" y1="42" x2="240" y2="42" stroke="#3F3A3F" stroke-width="1"/>
      <rect x="40" y="14" width="120" height="28" fill="#07060A" stroke="#FF4438" stroke-opacity=".3" stroke-width="0.8"/>
      <rect x="130" y="22" width="34" height="20" fill="#07060A" stroke="#FF4438" stroke-opacity=".25" stroke-width="0.8"/>
      <line x1="56" y1="14" x2="56" y2="-12" stroke="#07060A" stroke-width="2.5"/>
      <circle cx="56" cy="-14" r="1.8" fill="#C9A24B">
        <animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <rect x="52" y="22" width="8" height="6" fill="#FF4438" opacity=".85">
        <animate attributeName="opacity" values=".85;.45;.85" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="70" y="22" width="8" height="6" fill="#FF4438" opacity=".7">
        <animate attributeName="opacity" values=".7;.35;.7" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="104" y="20" width="9" height="22" fill="#FF5C4C" opacity=".9"/>
      <polygon points="104,42 113,42 126,54 92,54" fill="#FF4438" opacity=".12"/>
    </g>

    <!-- ship inbound -->
    <g transform="translate(560,120) rotate(18)" opacity=".95">
      <polygon points="0,6 -16,4 -10,7 -18,8.6 -6,9.5 0,9" fill="#FF4438" opacity=".8">
        <animate attributeName="opacity" values=".8;.4;.8" dur=".9s" repeatCount="indefinite"/>
      </polygon>
      <path d="M0 10 Q10 2 26 4 Q36 5.4 38 8 Q36 10.6 26 12 Q10 13.6 0 10 Z" fill="#222A35" stroke="#FF4438" stroke-opacity=".6" stroke-width=".7"/>
      <path d="M16 4.6 Q21 1.4 27 4.4 Q21 3.2 16 4.6 Z" fill="#FFA894" opacity=".5"/>
    </g>

    <!-- baseline -->
    <rect x="0" y="236" width="900" height="4" fill="#FF4438" opacity=".85"/>
  </g>
</svg>
